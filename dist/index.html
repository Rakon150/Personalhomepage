<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="style.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  <title>About Rakon150</title>
</head>

<body class="pattern-background">
  <main>
    <h1>Rakon150</h1>
    <div class="buttons">
      <button data-section="LINKS">LINKS</button>
      <button data-section="ABOUT">ABOUT</button>
      <button data-section="PROJECTS">PROJECTS</button>
      <button data-section="CONTACT">CONTACT</button>
    </div>
  </main>

  <div id="overlay" class="overlay" aria-hidden="true">
    <div id="backdrop" class="backdrop"></div>
    <div id="morph" class="morph" role="dialog" aria-modal="true" aria-labelledby="morph-title">
      <div class="morph-header">
        <h2 id="morph-title" class="morph-title"></h2>
        <button id="morph-close" class="morph-close" aria-label="Close">✕</button>
      </div>
      <div id="morph-body" class="morph-body"></div>
    </div>
  </div>

  <a id="status-dot" class="status" href="https://status.rakon.qzz.io/status/publicstatus" target="_blank" rel="noopener" aria-label="Service status" title="Checking status…"></a>

  <script src="script.js"></script>
</body>
</html>
